<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김천다수초 스티커 만들기 체험 신청</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fdf8f3;
      color: #302921;
      font-family: system-ui, "Apple SD Gothic Neo", "Nanum Gothic", sans-serif;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 24px 14px;
    }

    header {
      padding: 28px 16px;
      border-radius: 20px;
      background: #805134;
      color: white;
      text-align: center;
    }

    header p {
      margin: 6px 0;
      line-height: 1.6;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(23px, 4vw, 34px);
    }

    .school {
      color: #ffe0a1;
      font-size: 14px;
    }

    #status {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #59341f;
      font-size: 12px;
    }

    #message {
      color: #a32236;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #message:not(:empty) {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #fff0f0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 0 14px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 21px;
      color: #70472f;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #eee8e2;
      color: #44382b;
      font: inherit;
      cursor: pointer;
    }

    button:hover { filter: brightness(.95); }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .primary {
      background: #805134;
      color: white;
      font-weight: 700;
    }

    .danger {
      background: #fce8e9;
      color: #a32236;
    }

    .week,
    #calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .week {
      margin-bottom: 8px;
      text-align: center;
      font-weight: 700;
    }

    .week span { padding: 8px 0; }
    .sun { color: #b12640; }
    .sat { color: #2455a0; }

    .day {
      display: flex;
      flex-direction: column;
      min-height: 170px;
      padding: 12px;
      border: 1px solid #e3d9d0;
      border-radius: 14px;
      background: white;
      cursor: pointer;
    }

    .day:hover,
    .day:focus-visible {
      outline: 3px solid #d5b899;
    }

    .day.weekend { background: #f3efeb; }

    .day.full {
      background: #fff5f4;
      border-color: #edb2b5;
    }

    .datehead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee4dc;
    }

    .count {
      padding: 3px 7px;
      border-radius: 16px;
      background: #fff0ce;
      color: #714715;
      font-size: 12px;
      white-space: nowrap;
    }

    .full .count {
      background: #ffe0e1;
      color: #992638;
    }

    .preview {
      flex: 1;
      margin: 10px 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      line-height: 1.9;
    }

    .preview li {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .day .primary {
      width: 100%;
      padding: 7px 4px;
      font-size: 12px;
    }

    .small {
      color: #73695e;
      font-size: 12px;
    }

    dialog {
      width: min(820px, 94vw);
      max-height: 90vh;
      padding: 0;
      border: 0;
      border-radius: 20px;
      color: #302921;
      box-shadow: 0 20px 80px #0004;
    }

    dialog::backdrop { background: #24190eb3; }

    #add-dialog,
    #delete-dialog {
      width: min(460px, 94vw);
    }

    .modal {
      max-height: 85vh;
      padding: 26px;
      overflow-y: auto;
    }

    .modalhead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modalhead h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
    }

    .close {
      padding: 3px 12px;
      font-size: 24px;
    }

    #detail-count {
      color: #805134;
      font-size: 19px;
    }

    #names {
      display: grid;
      gap: 12px;
      padding: 0;
      list-style: none;
    }

    #names li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px;
      border: 1px solid #e9ded3;
      border-radius: 14px;
      background: #faf5ef;
    }

    .number {
      min-width: 28px;
      color: #805134;
      font-size: 20px;
      font-weight: 800;
    }

    .student {
      flex: 1;
      overflow-wrap: anywhere;
      font-size: clamp(21px, 4vw, 29px);
      font-weight: 700;
    }

    #names button {
      flex-shrink: 0;
      font-size: 13px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cdbeb0;
      border-radius: 10px;
      font: inherit;
      font-size: 18px;
    }

    input:focus { outline: 3px solid #d5b899; }

    @media (max-width: 640px) {
      main { padding: 14px 7px; }

      .toolbar h2 { font-size: 18px; }

      .week,
      #calendar { gap: 3px; }

      .day {
        min-height: 132px;
        padding: 5px;
        border-radius: 8px;
      }

      .datehead {
        flex-direction: column;
        align-items: flex-start;
      }

      .count {
        padding: 2px 4px;
        font-size: 10px;
      }

      .preview {
        margin: 5px 0;
        font-size: 10px;
        line-height: 1.7;
      }

      .day .primary,
      .small { font-size: 10px; }

      .modal { padding: 20px; }

      #names li {
        gap: 8px;
        padding: 13px 10px;
      }

      #names button { padding: 8px; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <p class="school">김천다수초등학교 메이커 프로그램</p>
      <h1>나만의 스티커 만들기 체험 신청</h1>
      <p>평일 하루 8명 · 날짜를 누르면 신청자 명단이 크게 보입니다.</p>
      <div id="status" role="status" aria-live="polite">
        연결 확인 중…
      </div>
    </header>

    <div id="message" role="alert"></div>

    <div class="toolbar">
      <h2>2026년 11월 체험 일정표</h2>
      <button id="refresh" type="button">새로고침</button>
    </div>

    <div class="week" aria-hidden="true">
      <span class="sun">일</span>
      <span>월</span>
      <span>화</span>
      <span>수</span>
      <span>목</span>
      <span>금</span>
      <span class="sat">토</span>
    </div>

    <div id="calendar" aria-label="11월 체험 달력"></div>
  </main>

  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="modal">
      <div class="modalhead">
        <h2 id="detail-title"></h2>
        <button
          class="close"
          data-close="detail-dialog"
          aria-label="닫기"
        >×</button>
      </div>

      <p id="detail-count" aria-live="polite"></p>
      <ol id="names"></ol>

      <div class="actions">
        <button data-close="detail-dialog">닫기</button>
        <button id="detail-add" class="primary">신청하기</button>
      </div>
    </div>
  </dialog>

  <dialog id="add-dialog" aria-labelledby="add-title">
    <div class="modal">
      <h2 id="add-title">체험 신청하기</h2>
      <p id="add-date"></p>

      <form id="add-form">
        <label for="student-name">학년·반·이름</label>
        <input
          id="student-name"
          placeholder="예: 4-2 홍길동"
          minlength="2"
          maxlength="40"
          autocomplete="off"
          required
        >

        <div class="actions">
          <button type="button" data-close="add-dialog">취소</button>
          <button id="submit" class="primary" type="submit">
            등록하기
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <div class="modal">
      <h2 id="delete-title">신청 내역 삭제</h2>
      <p id="delete-label"></p>

      <form id="delete-form">
        <label for="password">관리자 비밀번호</label>
        <input
          id="password"
          type="password"
          autocomplete="off"
          required
        >

        <div class="actions">
          <button type="button" data-close="delete-dialog">취소</button>
          <button id="delete-submit" class="danger" type="submit">
            삭제하기
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <script>
    'use strict';

    const SUPABASE_URL =
      'https://thouylmffwzguocsrsvy.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_9Vrx2eDjvWkCj4MQSG_KQg_kw8DjQmg';

    const MAX = 8;
    const START = '2026-11-01';
    const END = '2026-12-01';

    const $ = id => document.getElementById(id);

    let db;
    let rows = [];
    let ready = false;
    let live = false;
    let busy = false;
    let deleting = false;
    let loading = false;
    let reloadRequested = false;
    let detailDate = '';
    let addDate = '';
    let deleteTarget = null;
    let refreshTimer;

    function showStatus() {
      $('status').textContent = !ready
        ? '연결 확인 필요'
        : live
          ? '● 실시간 연결됨'
          : '연결 복구 중';
    }

    function showMessage(text = '') {
      $('message').textContent = text;
    }

    function getList(date) {
      return rows.filter(row => row.event_date === date);
    }

    function getWeekday(date) {
      return new Date(date + 'T12:00:00+09:00').getUTCDay();
    }

    function isWeekend(date) {
      return [0, 6].includes(getWeekday(date));
    }

    function formatDate(date) {
      const month = Number(date.slice(5, 7));
      const day = Number(date.slice(8, 10));
      const weekday = '일월화수목금토'[getWeekday(date)];

      return `${month}월 ${day}일 (${weekday})`;
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;

      return element;
    }

    function openDialog(id) {
      if (!$(id).open) $(id).showModal();
    }

    function renderCalendar() {
      const calendar = $('calendar');
      calendar.replaceChildren();

      for (let day = 1; day <= 30; day++) {
        const date = `2026-11-${String(day).padStart(2, '0')}`;
        const list = getList(date);
        const full = list.length >= MAX;
        const weekend = isWeekend(date);

        const cell = makeElement(
          'article',
          `day${full ? ' full' : ''}${weekend ? ' weekend' : ''}`
        );

        cell.tabIndex = 0;
        cell.setAttribute('role', 'button');
        cell.setAttribute(
          'aria-label',
          `${formatDate(date)}, ${list.length}명 신청, 명단 보기`
        );

        const dateColor = getWeekday(date) === 0
          ? 'sun'
          : getWeekday(date) === 6
            ? 'sat'
            : '';

        const head = makeElement('div', 'datehead');

        head.append(
          makeElement('strong', dateColor, String(day)),
          makeElement('span', 'count', `${list.length}/${MAX}`)
        );

        const preview = makeElement('ul', 'preview');

        list.slice(0, 3).forEach(row => {
          preview.append(
            makeElement('li', '', row.student_name)
          );
        });

        if (list.length > 3) {
          preview.append(
            makeElement('li', '', `외 ${list.length - 3}명`)
          );
        }

        cell.append(head, preview);

        if (!weekend && !full) {
          const button = makeElement('button', 'primary', '＋ 신청');
          button.disabled = !ready;

          button.addEventListener('click', event => {
            event.stopPropagation();
            openAdd(date);
          });

          cell.append(button);
        } else {
          cell.append(
            makeElement('span', 'small', weekend ? '주말' : '마감')
          );
        }

        cell.addEventListener('click', () => openDetail(date));

        cell.addEventListener('keydown', event => {
          if (
            event.target === cell &&
            ['Enter', ' '].includes(event.key)
          ) {
            event.preventDefault();
            openDetail(date);
          }
        });

        calendar.append(cell);
      }

      renderDetail();
    }

    function openDetail(date) {
      detailDate = date;
      renderDetail();
      openDialog('detail-dialog');
    }

    function renderDetail() {
      if (!detailDate) return;

      const list = getList(detailDate);

      $('detail-title').textContent =
        `${formatDate(detailDate)} 신청자 명단`;

      $('detail-count').textContent =
        `${list.length}명 / 정원 ${MAX}명` +
        (list.length >= MAX ? ' · 마감' : '');

      const names = $('names');
      names.replaceChildren();

      if (!list.length) {
        names.append(
          makeElement('li', '', '아직 신청한 학생이 없습니다.')
        );
      }

      list.forEach((row, index) => {
        const item = makeElement('li');
        const deleteButton = makeElement('button', 'danger', '삭제');

        deleteButton.addEventListener('click', () => openDelete(row));

        item.append(
          makeElement('span', 'number', `${index + 1}.`),
          makeElement('span', 'student', row.student_name),
          deleteButton
        );

        names.append(item);
      });

      $('detail-add').disabled =
        !ready ||
        isWeekend(detailDate) ||
        list.length >= MAX;

      $('detail-add').textContent = isWeekend(detailDate)
        ? '주말 신청 불가'
        : list.length >= MAX
          ? '정원 마감'
          : '신청하기';
    }

    async function loadRegistrations() {
      if (!db) return;

      if (loading) {
        reloadRequested = true;
        return;
      }

      loading = true;

      try {
        const { data, error } = await db
          .from('sticker_reservations')
          .select('id,event_date,student_name,created_at')
          .gte('event_date', START)
          .lt('event_date', END)
          .order('created_at', { ascending: true })
          .order('id', { ascending: true });

        if (error) throw error;

        rows = data || [];
        ready = true;

        showMessage();
        renderCalendar();
      } catch (error) {
        ready = false;

        showMessage(
          '명단을 불러오지 못했습니다.\n' + error.message
        );

        renderCalendar();
      } finally {
        loading = false;
        showStatus();

        if (reloadRequested) {
          reloadRequested = false;
          void loadRegistrations();
        }
      }
    }

    function scheduleRefresh() {
      clearTimeout(refreshTimer);

      refreshTimer = setTimeout(() => {
        void loadRegistrations();
      }, 150);
    }

    function openAdd(date) {
      if (!ready) {
        alert('데이터 연결을 확인해 주세요.');
        return;
      }

      if (busy || isWeekend(date)) return;

      if (getList(date).length >= MAX) {
        alert('정원 8명이 마감되었습니다.');
        return;
      }

      addDate = date;

      $('add-date').textContent =
        `${formatDate(date)} · 현재 ${getList(date).length}/${MAX}명`;

      $('student-name').value = '';

      openDialog('add-dialog');
      $('student-name').focus();
    }

    $('add-form').addEventListener('submit', async event => {
      event.preventDefault();

      if (busy || !ready) return;

      const name = $('student-name').value.trim();

      if (name.length < 2 || name.length > 40) {
        alert('학년·반·이름을 2~40자로 입력하세요.');
        return;
      }

      const date = addDate;

      busy = true;
      $('submit').disabled = true;
      $('submit').textContent = '등록 중…';

      try {
        const { error } = await db
          .from('sticker_reservations')
          .insert({
            event_date: date,
            student_name: name
          });

        if (error) throw error;

        $('add-dialog').close();

        await loadRegistrations();
        openDetail(date);
      } catch (error) {
        alert(
          '신청하지 못했습니다: ' + error.message +
          '\n네트워크 오류라면 재신청 전에 명단을 확인해 주세요.'
        );

        await loadRegistrations();
      } finally {
        busy = false;
        $('submit').disabled = false;
        $('submit').textContent = '등록하기';
      }
    });

    function openDelete(row) {
      if (deleting) return;

      deleteTarget = row;

      $('delete-label').textContent =
        `${formatDate(row.event_date)} · ${row.student_name}`;

      $('password').value = '';

      openDialog('delete-dialog');
      $('password').focus();
    }

    $('delete-form').addEventListener('submit', async event => {
      event.preventDefault();

      if (deleting || !deleteTarget) return;

      deleting = true;
      $('delete-submit').disabled = true;
      $('delete-submit').textContent = '삭제 중…';

      try {
        const { error } = await db.rpc(
          'delete_sticker_reservation',
          {
            p_id: String(deleteTarget.id),
            p_password: $('password').value
          }
        );

        if (error) throw error;

        $('password').value = '';
        $('delete-dialog').close();

        await loadRegistrations();
      } catch (error) {
        alert('삭제하지 못했습니다: ' + error.message);
      } finally {
        deleting = false;
        $('delete-submit').disabled = false;
        $('delete-submit').textContent = '삭제하기';
      }
    });

    $('detail-add').addEventListener('click', () => {
      openAdd(detailDate);
    });

    $('refresh').addEventListener('click', () => {
      void loadRegistrations();
    });

    document.querySelectorAll('[data-close]').forEach(button => {
      button.addEventListener('click', () => {
        $(button.dataset.close).close();
      });
    });

    $('delete-dialog').addEventListener('close', () => {
      $('password').value = '';
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) void loadRegistrations();
    });

    window.addEventListener('online', () => {
      void loadRegistrations();
    });

    renderCalendar();

    try {
      if (!window.supabase) {
        throw new Error(
          '연결 프로그램을 불러오지 못했습니다. 인터넷을 확인해 주세요.'
        );
      }

      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      db.channel('sticker-calendar-nov2026')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'sticker_reservations'
          },
          scheduleRefresh
        )
        .subscribe(state => {
          live = state === 'SUBSCRIBED';
          showStatus();

          if (live) void loadRegistrations();
        });

      void loadRegistrations();

      setInterval(() => {
        if (!document.hidden) void loadRegistrations();
      }, 15000);
    } catch (error) {
      showMessage(error.message);
      showStatus();
    }
  </script>
</body>
</html>
